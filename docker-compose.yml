# ==============================================================================
# Docker Compose - Buscavag Production Stack
# ==============================================================================
# Dois serviços independentes compartilhando o banco SQLite via volume.
#
# Uso:
#   docker-compose build
#   docker-compose up -d
#   docker-compose logs -f scraper
#   docker-compose logs -f web

services:
  # --------------------------------------------------------------------------
  # Microserviço Python Scrapling Engine (Evasão Anti-Bot & Scrapers Resilientes)
  # --------------------------------------------------------------------------
  scrapling-engine:
    build:
      context: ./src/services/scrapling-engine
      dockerfile: Dockerfile
    container_name: buscavag-scrapling-engine
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Frontend Dashboard (Next.js)
  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: buscavag-web
    ports:
      - "3000:3000"
    volumes:
      - buscavag-data:/app/data
      - buscavag-uploads:/app/uploads
    environment:
      - DATABASE_PATH=/app/data/buscavag.db
      - NODE_ENV=production
      - SCRAPLING_ENGINE_URL=http://scrapling-engine:8000
    restart: unless-stopped
    depends_on:
      - scraper
      - scrapling-engine

  # --------------------------------------------------------------------------
  # Backend Scrapers + Cron (Node.js + Playwright)
  # --------------------------------------------------------------------------
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: buscavag-scraper
    volumes:
      - buscavag-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/buscavag.db
      - NODE_ENV=production
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 */4 * * *}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SCRAPLING_ENGINE_URL=http://scrapling-engine:8000
    restart: unless-stopped
    depends_on:
      - scrapling-engine

# Volume nomeado para persistência do banco SQLite e uploads de currículos
volumes:
  buscavag-data:
    driver: local
  buscavag-uploads:
    driver: local

